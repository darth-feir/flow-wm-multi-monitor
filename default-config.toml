#:schema ./schemas/flow-config.schema.json

# Example application configuration for FlowWM.
#
# This file is a HAND-WRITTEN EXAMPLE. `flow config init` copies it verbatim
# into your config directory (~/.config/flow/flow.toml) as a fully-commented
# starting point.
#
# It is NOT read at runtime. The canonical default values live in code, in
# src/config/defaults.rs, and are applied by serde when fields are absent from
# your flow.toml. That means your flow.toml may be partial or even empty.
#
# Keep this file in sync with src/config/defaults.rs: the test
# `default_config_toml_matches_compiled_defaults` enforces that deserializing
# this file yields exactly FlowConfig::default().
#
# For field documentation, see the FlowConfig docstring in src/config/types.rs.

# Number of columns that fit side-by-side on one monitor screen.
# The actual pixel width of each column is computed at runtime from this value,
# the monitor resolution, and window_gap — so the layout always fills the screen.
#
# Power users can override the auto-computed width by setting column_width explicitly:
#   column_width = 1280       # (optional) fixed pixel width, ignores columns_per_screen
columns_per_screen = 4

# Minimum column width in pixels. Columns cannot be resized below this.
min_column_width_px = 640

# Column width presets (optional). When this section is present every monitor
# keeps its own current preset: new columns take that width, and
# `flow dispatch width next|prev|cycle|<preset>` switches every column on the
# focused monitor to another preset. A preset "1/n" is sized so that n columns
# plus their gaps fill the work area exactly ("1/1" = the whole work area);
# a plain number such as 0.5 is accepted too. `default` names the preset every
# monitor starts on (it must be one of `presets`; omitted = the first one).
# Without this section columns are sized from columns_per_screen / column_width.
#
# Stacked columns: `visible_rows` is how many rows of a column are on screen
# at once (0 = every row shares the height, the default); a column with more
# rows keeps a viewport that `focus up`/`focus down` scroll through, the rows
# outside it parked off-screen. `max_rows` caps how many rows a column may
# hold (0 = unlimited); merging into a full column moves the window past it.
#
# [columns]
# presets = ["1/3", "1/2", "1/1"]
# default = "1/2"
# visible_rows = 2
# max_rows = 4

# Minimum row height in pixels — the floor for any single window's allocated
# height inside a column. Bounds the maximum number of rows that can stack
# inside one column, and the lower clamp for future drag / IPC continuous
# height adjustment of individual rows.
min_window_height_px = 100

# Minimum row height in pixels — the dedicated vertical floor for drag-resize
# of a single row. Dragging a row boundary cannot shrink either row below this,
# and once the shrinking row hits it the edge elastically pins (overshoot during
# the drag, snap back on release). Distinct from min_window_height_px (the
# row-stack-count cap); the two are independent.
min_row_height_px = 100

# Whether `flow start` runs the update checker (the same one behind
# `flow update`, see the [update] table below) and prints a one-line notice
# when something newer exists on GitHub. This fork opts out of the start-time
# check (off by default): nothing is contacted unless you set this to true.
# When on, the check runs after the daemon is ready, is bounded by a short
# timeout, stays silent on any failure and never blocks or aborts startup.
# It only ever reports; nothing is downloaded or installed. The explicit
# `flow update` command is always available regardless of this flag.
check_for_updates = false

# Whether a window that is maximized when FlowWM meets it (at startup, when it
# opens, when tiling is turned back on) is un-maximized and classified through
# your rules — tiled or floated like any other window — instead of being left
# alone as "ignored: maximized" until you restore it. Fullscreen windows
# (games, videos) are never adopted, nor is a window your rules ignore. FlowWM
# maximizes an adopted window again when it hands the desktop back
# (`flow dispatch tiling off`, `flow stop`). `set-window tile|float|cycle` on
# an ignored window adopts it whatever this is set to.
adopt_maximized = false

# Padding / spacing settings in pixels.
#
# - window_gap: uniform gap between all elements (windows and screen edges)
# - up: reserved space above the tiling area
# - down: reserved space below the tiling area (e.g., for taskbar clearance)
[padding]
window_gap = 16
up = 0
down = 0

# Animation settings for layout transitions.
[animation]
enabled = true
duration_ms = 240
easing = "ease-out-expo"

# Strategy for restoring minimized tiling windows.
# Options: original_slot, right_of_focused, append_right
[minimize_restore]
strategy = "original_slot"

# Window border overlay settings.
#
# Each managed window gets a thin colored ring drawn as a separate layered
# overlay window that follows the target's HWND geometry. This produces sharp
# komorebi/Hyprland-style borders that the default Windows drop-shadow cannot.
#
# - enabled:        master switch (false = no overlays created)
# - thickness:      border ring width in pixels (applied on all four sides)
# - overlap:        px the ring overlaps the window content (0 = full gap,
#                    thickness = content fills the slot); closes the DWM hairline
# - focused_color:  border color for the focused/active window
# - unfocused_color: border color for tiled-but-not-focused windows
# - floating_color: border color for floating windows
#
# Colors are hex strings of the form "#RRGGBB".
[borders]
enabled = true
thickness = 3
overlap = 1
focused_color = "#00AAFF"
unfocused_color = "#555555"
floating_color = "#AA00FF"

# Floating window configuration.
#
# Sizes (both optional): when unset, the daemon falls back to a built-in
# policy: 60% × 80% of the monitor work area, capped at ~1536 × 1152
# (QHD-derived) so ultrawide / 4K monitors don't produce absurdly large popups.
# An explicit pixel value below is always respected as-is — the cap applies
# only to the fallback path.
#
# - always_on_top: keep floating windows (and windows your rules ignore, such
#   as dialogs) above the tiled windows, as niri does — even when a tiled
#   window has the focus, so a dialog is never hidden behind a tile. They are
#   put back in the normal z-order when tiled, when tiling is turned off and
#   when FlowWM stops; a window that was already "always on top" by itself
#   keeps that. false = a focused tile covers the floats (upstream behaviour).
[floating]
# default_width = 1200    # (optional) explicit default float width in pixels
# default_height = 800    # (optional) explicit default float height in pixels
always_on_top = false

# Focus reconciliation settings.
#
# EVENT_SYSTEM_FOREGROUND is a best-effort stream: under rapid window churn
# (e.g. a browser closing multiple tabs), the OS can settle the foreground
# without emitting the final event, leaving flow's internal focus stuck on a
# stale window. The daemon closes that gap by periodically reconciling its
# tracked focus against the authoritative GetForegroundWindow() query.
#
# - foreground_sync_interval_ms: interval between reconciliation passes (ms).
#   The common (in-sync) pass is a single microsecond-scale read that no-ops.
[focus]
foreground_sync_interval_ms = 250

# Tile-drag configuration.
#
# When a user drags a tiled window by its title bar, a live non-committing
# preview reflows the other windows to the prospective layout on each zone
# change; on release the move commits and the dragged window snaps into its
# slot. Floating windows never enter the drag state machine.
#
# - edge_scroll_width:          px band at screen edge that triggers viewport scroll
# - col_edge_ratio:             fraction of column width for column-insert edge band
# - col_edge_max_px:            pixel cap on the column-insert hit band
# - edge_scroll_initial_delay_ms:  gap (ms) from the immediate entry scroll to the
#                                  first repeat; clamped up to the repeat interval
# - edge_scroll_repeat_interval_ms: gap (ms) between successive column scrolls while
#                                   held; clamped up to the animation duration and an
#                                   internal spam-guard floor
[drag]
edge_scroll_width = 30
col_edge_ratio = 0.18
col_edge_max_px = 120
edge_scroll_initial_delay_ms = 500
edge_scroll_repeat_interval_ms = 240

# Navigation at the edges of a strip.
#
# - edge_hop: when true (the default), `focus left/right` and `move-window
#   left/right` at the end of a strip hop to the monitor in that direction
#   (and up/down to a stacked one). When false they stop at the edge;
#   `focus-monitor` and `move-to-monitor` always cross monitors.
[navigation]
edge_hop = true

# Loadout save/restore settings.
#
# - default_path:  file name (relative to config dir) used by
#                   `flow loadout save` and `flow loadout restore`.
#                   A plain file name: no directories, no "..", no drive.
[loadout]
default_path = "loadout.json"

# Daemon log retention. The daemon writes one logs/flowd-YYYY-MM-DD.log per
# day and deletes, at every start, the ones older than keep_days days (by the
# date in the file name). 0 = keep every log file forever. Window titles are
# only logged at debug level (`flow start --verbose`).
[logging]
keep_days = 14

# Update checker (`flow update`, and the start-time notice above). It asks
# GitHub how this build relates to a branch or to the latest release and
# prints the answer plus how to update; it NEVER downloads or replaces the
# binaries. Both keys are optional:
#
# - repo:    "owner/name" on github.com. Default: derived from the `origin`
#            remote of the checkout the binary was built from (https or ssh
#            github.com URL), else the upstream "CCpcalvin/flow-wm".
# - branch:  the branch to compare the build's commit against (see
#            `flow --version` for the commit and branch). Default: the branch
#            checked out at build time. "" (empty) compares the crate version
#            against the latest release instead.
#
# [update]
# repo = "yourname/flow-wm"
# branch = "main"
